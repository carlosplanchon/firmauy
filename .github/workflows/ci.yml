name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Ruff
        run: uvx ruff check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # libpcsclite-dev + swig are build deps for pyscard (a C extension); without the pcsclite
      # headers `uv sync` fails to build it. softhsm2 + opensc let the PKCS#11 / XAdES integration
      # tests run instead of skipping. No pcscd or reader is needed: they use a software token.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev swig softhsm2 opensc
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest

  # Windows: the oldest and newest supported Python, not the whole matrix. What differs there is the
  # staging and commit of signed output, the doctor and the platform defaults, none of which depend
  # on the Python version. No SoftHSM or OpenSC, so the PKCS#11 integration tests skip, as they do
  # on any machine without them.
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # pyscard publishes Windows wheels up to CPython 3.13, so on 3.14 uv builds it from source,
      # which needs swig. MSVC and the Windows SDK (winscard) are already on the runner.
      - name: Install swig
        if: matrix.python-version == '3.14'
        run: choco install swig --no-progress -y
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest

  # The two searching checks, both on every pull request and every push to main. The exhaustive
  # TSTInfo sweep is half a minute of work that found two escapes which had survived three
  # reviews and 385 deterministic tests, so leaving it archived was never defensible. The deep
  # property profile covers what the sweep cannot walk through: combined damage, and sampled
  # verification times across a hundred-year horizon. Procedure and acceptance criteria for both
  # are in docs/security-invariants.md.
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pyscard build deps only; the sweep uses software keys, so no SoftHSM or OpenSC.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev swig
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run the sweep
        run: FIRMAUY_SWEEP=1 uv run pytest tests/test_sweep_tstinfo.py -q
      # The deep property profile belongs here rather than in `test`, which already runs the
      # shallow one across four Python versions. Rare counterexamples do not care which
      # interpreter finds them, and this way the matrix stays fast.
      - name: Run the deep property profile
        run: FIRMAUY_DEEP=1 uv run pytest tests/test_properties_timestamp.py -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
