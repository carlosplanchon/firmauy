# Zensical configuration for the English mirror, built into site/en/.
#
# The Spanish site is the default and uses zensical.toml. Keep the navigation in sync with that
# file so both languages offer the same pages. Existing English reference pages are reused from
# docs/; only the landing page and the setup guide are new.

[project]
site_name = "FirmaUY"
site_description = "Sign and verify PDF, XML and arbitrary files with the Uruguayan national ID card."
site_author = "Carlos A. Planchón"
site_url = "https://carlosplanchon.github.io/firmauy/en/"
copyright = """
Copyright &copy; 2026 Carlos A. Planchón. Licensed under the Apache License 2.0.
"""
docs_dir = "docs"
site_dir = "site/en"

nav = [
  { "Home" = "index.md" },
  { "Setup" = "setup.md" },
  { "Usage guide" = "usage.md" },
  { "Cookbook" = "cookbook.md" },
  { "Security and keys" = "https://github.com/carlosplanchon/firmauy/blob/main/docs/security.md" },
  { "Trust anchors" = "trust-anchors.md" },
  { "Card protocol" = "card-protocol.md" },
  { "OpenSC backend" = "opensc-backend.md" },
  { "Library API" = "api.md" },
  { "Security invariants" = "security-invariants.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[project.validation]
invalid_links = true
invalid_link_anchors = true
# The security invariants page cites Agesic clauses as [CA.4-6] labels. They are labels, not links.
unresolved_references = false

[project.extra]
alternate = [
  { name = "Español", link = "/", lang = "es" },
  { name = "English", link = "/en/", lang = "en" },
]
